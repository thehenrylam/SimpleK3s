[pytest]
# Unit tests for the verification logic. The on-node package is stdlib-only and lives
# where the bootstrap layer ships it from, so it is put on the path rather than
# installed — there is deliberately no python project to install (see CLAUDE.md).
testpaths = testcases/unit
# The host-side status tool is on the path too: its cross-node reconciliation
# is real logic that a live cluster exercises only by accident.
pythonpath =
    k3s_cluster/cluster_app/bootstrap/data/py
    examples/standard_deployment/scripts
    k3s_cluster/data
    testcases/e2e
addopts = -q
