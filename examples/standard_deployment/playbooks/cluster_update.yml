---
# Gate: refuses to proceed if this tier's config is unconfigured.
- name: Template and validate cluster tfvars
  ansible.builtin.import_playbook: cluster_template.yml

- name: Update
  # It takes the hosts that is under the hosts section from inventory.yml
  #   - Used for variables like "inventory_hostname"
  hosts: wave2_cluster
  strategy: free
  gather_facts: false

  tasks:
  - name: Update Infra
    include_role:
      name: apply
    vars:
      target_dir: "{{ module[inventory_hostname].dir }}"
      plan_file: "{{ inventory_hostname }}.tfplan"
      apply_destroy: false

  # Capture the rc rather than aborting here, so the output below prints first.
  # Do not reintroduce `|| true`: it discards the script's exit code, and a failed
  # service update then reports success.
  - name: Update Services
    shell: "./ssm_update_services.sh {{ aws_profile }} 2>&1"
    args:
      chdir: "{{ toolscript_dir }}"
    register: cmdout_update
    changed_when: false
    failed_when: false

  - name: Show Update Output
    debug:
      var: cmdout_update.stdout_lines

  - name: Fail if service update did not succeed
    ansible.builtin.fail:
      msg: "Service update failed (rc={{ cmdout_update.rc }})"
    when: cmdout_update.rc != 0
