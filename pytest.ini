[pytest]
# Unit tests for on-node code. The package under test is stdlib-only and lives
# where the bootstrap layer ships it from, so it is put on the path rather than
# installed — there is deliberately no python project to install (see CLAUDE.md).
testpaths = testcases/unit
pythonpath = k3s_cluster/cluster_app/bootstrap/data/py
addopts = -q
