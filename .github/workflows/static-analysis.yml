name: Static Analysis

on:
  push:
    branches: [main]
    paths:
      - "**/*.tf"
      - "**/*.tftpl"
      - "**/*.tmpl"
      - "**/*.sh"
      - "**/*.py"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.env"
      - "**/*.tfvars"
      - ".tflint.hcl"
      - ".checkov.yaml"
      - ".shellcheckrc"
      - ".github/workflows/static-analysis.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.tf"
      - "**/*.tftpl"
      - "**/*.tmpl"
      - "**/*.sh"
      - "**/*.py"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.env"
      - "**/*.tfvars"
      - ".tflint.hcl"
      - ".checkov.yaml"
      - ".shellcheckrc"
      - ".github/workflows/static-analysis.yml"

env:
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
  SHELLCHECK_VERSION: "0.11.0"
  CHECKOV_VERSION: "3.2.530"
  RUFF_VERSION: "0.15.17"
  TOFU_VERSION: "1.11.2"
  TERRAFORM_VERSION: "1.14.3"

jobs:
  python:
    name: Python Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Run ruff check
        run: bash testcases/test-out_python.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ
          sudo mv "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck

      - name: Run shellcheck
        run: bash testcases/test-out_shellscripts.sh

  terraform-lint:
    name: Terraform Lint (fmt, tflint, checkov)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # fmt is identical between OpenTofu and Terraform; run it once via OpenTofu.
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Format check
        run: tofu fmt -check -recursive

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: "v0.62.1"

      - name: Cache tflint plugins
        uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: ${{ runner.os }}-tflint-${{ hashFiles('.tflint.hcl') }}

      - name: Init tflint
        run: tflint --init

      - name: Run tflint
        run: tflint --recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache checkov
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-checkov-${{ hashFiles('.checkov.yaml') }}

      - name: Install checkov
        run: pip install "checkov==${CHECKOV_VERSION}"

      - name: Run checkov
        run: checkov -d . --config-file .checkov.yaml

  terraform-validate:
    name: Terraform Validate (${{ matrix.tool }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        tool: [opentofu, terraform]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        if: matrix.tool == 'opentofu'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Setup Terraform
        if: matrix.tool == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Select binary
        run: |
          if [ "${{ matrix.tool }}" = "opentofu" ]; then
            echo "TF_BIN=tofu" >> "$GITHUB_ENV"
          else
            echo "TF_BIN=terraform" >> "$GITHUB_ENV"
          fi

      - name: Create provider plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache provider plugins
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.tool }}-providers-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.tool }}-providers-

      - name: Validate all modules
        run: |
          set -e
          for mod in \
            k3s_cluster \
            examples/modules/vpc_cloud \
            examples/modules/idp_cognito \
            examples/ex_basic \
            examples/ex_idp; do
            echo "::group::${TF_BIN} validate: ${mod}"
            ( cd "${mod}" && "${TF_BIN}" init -backend=false && "${TF_BIN}" validate )
            echo "::endgroup::"
          done
