name: Static Analysis

on:
  push:
    branches: [main]
    paths:
      - "**/*.tf"
      - "**/*.tftpl"
      - "**/*.tmpl"
      - "**/*.sh"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.env"
      - "**/*.tfvars"
      - ".tflint.hcl"
      - ".checkov.yaml"
      - ".shellcheckrc"
      - ".github/workflows/static-analysis.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.tf"
      - "**/*.tftpl"
      - "**/*.tmpl"
      - "**/*.sh"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.env"
      - "**/*.tfvars"
      - ".tflint.hcl"
      - ".checkov.yaml"
      - ".shellcheckrc"
      - ".github/workflows/static-analysis.yml"

env:
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
  SHELLCHECK_VERSION: "0.11.0"
  CHECKOV_VERSION: "3.2.530"

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ
          sudo mv "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck

      - name: Run shellcheck
        run: bash testcases/test-out_shellscripts.sh

  terraform:
    name: Terraform Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.11.2"

      - name: Create provider plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache provider plugins
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-tofu-providers-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tofu-providers-

      - name: Format check
        run: tofu fmt -check -recursive

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: "v0.62.1"

      - name: Cache tflint plugins
        uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: ${{ runner.os }}-tflint-${{ hashFiles('.tflint.hcl') }}

      - name: Init tflint
        run: tflint --init

      - name: Run tflint
        run: tflint --recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache checkov
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-checkov-${{ hashFiles('.checkov.yaml') }}

      - name: Install checkov
        run: pip install "checkov==${CHECKOV_VERSION}"

      - name: Run checkov
        run: checkov -d . --config-file .checkov.yaml

      - name: Validate k3s_cluster
        working-directory: k3s_cluster
        run: |
          tofu init -backend=false
          tofu validate

      - name: Validate examples/modules/vpc_cloud
        working-directory: examples/modules/vpc_cloud
        run: |
          tofu init -backend=false
          tofu validate

      - name: Validate examples/modules/idp_cognito
        working-directory: examples/modules/idp_cognito
        run: |
          tofu init -backend=false
          tofu validate

      - name: Validate examples/ex_basic
        working-directory: examples/ex_basic
        run: |
          tofu init -backend=false
          tofu validate

      - name: Validate examples/ex_idp
        working-directory: examples/ex_idp
        run: |
          tofu init -backend=false
          tofu validate
