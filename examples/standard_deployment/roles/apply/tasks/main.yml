---
# Call role: Plan
- name: Plan All (init plan file)
  include_role:
    name: plan
  vars:
    target_dir: "{{ module[inventory_hostname].dir }}"
    plan_destroy: "{{ apply_destroy }}"

# Apply all using each plan's outputted plan_file
- name: Module Apply (via plan file)
  # Output is tee'd so progress can be tailed while the task is still running --
  # Ansible cannot show a task's stdout until it exits. See defaults/main.yml.
  #
  # Without pipefail the pipeline would report tee's status (always 0), which
  # would make changed_when below true even for a failed apply.
  shell: |
    set -o pipefail  # so tofu's exit code survives the pipe to tee, not tee's
    mkdir -p "{{ tofu_stream_dir }}"
    AWS_PROFILE='{{ aws_profile }}' tofu apply --auto-approve -no-color {{ plan_file }} | tee "{{ apply_stream_log }}"
  args:
    chdir: "{{ module[inventory_hostname].dir }}"
    # /bin/sh is dash on Debian/Ubuntu and on the CI runners, and dash rejects
    # `set -o pipefail` outright ("Illegal option -o pipefail"). Verified.
    executable: /bin/bash
  register: cmdout_apply
  # cmdout_plan is generated from the "plan" role. 
  # If it's rc == 2, then it means there are no changes, thus no need to execute an apply
  when: cmdout_plan.rc == 2 
  changed_when: cmdout_apply.rc == 0

# Show the apply diff (as long as there the plan shows there is something worth applying)
- name: Show Apply Diff
  debug:
    var: cmdout_apply.stdout_lines
  when: cmdout_plan.rc == 2

# Clean up the plan file
- name: Clean Up (plan file)
  file:
    path: "{{ module[inventory_hostname].dir }}/{{ plan_file }}"
    state: absent